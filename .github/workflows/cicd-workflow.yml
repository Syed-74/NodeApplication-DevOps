
name: Node.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: Test the Node.js application
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test --if-present

      - name: Build application
        run: npm run build --if-present


  # JOB 2: Build and push Docker image
  build-docker:
    name: Build and Push Docker Image
    needs: build
    runs-on: ubuntu-latest

    # Never push images from pull requests
    if: github.event_name == 'push'

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:${{ github.sha }}


  # JOB 3: Deploy to AWS EC2
  deploy:
    name: Deploy to AWS EC2
    needs: build-docker

    runs-on: [self-hosted, linux, x64, aws-ec2]

    steps:
      - name: Pull Docker image
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:${{ github.sha }}

      - name: Stop and remove old container
        run: |
          docker rm -f nodejs-app-container || true

      - name: Start new container
        run: |
          docker run -d \
            --name nodejs-app-container \
            --restart unless-stopped \
            -p 5000:5000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:${{ github.sha }}

      - name: Verify deployment
        run: |
          sleep 5
          docker ps --filter name=nodejs-app-container
          docker logs --tail 50 nodejs-app-container

          if [ "$(docker inspect -f '{{.State.Running}}' nodejs-app-container)" != "true" ]; then
            echo "Container failed to start"
            exit 1
          fi
